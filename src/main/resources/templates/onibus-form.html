<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::scriptsExtra})}">
<head><title>Ônibus — Formulário</title></head>
<body>

<th:block th:fragment="content">

    <div class="page-header">
        <div class="header-text">
            <h2 th:text="${onibus.id != null} ? 'Editar Ônibus' : 'Novo Ônibus'">Ônibus</h2>
            <p>Preencha os dados do veículo abaixo.</p>
        </div>
    </div>

    <!-- Mensagem de sucesso/erro -->
    <div th:if="${sucesso}" style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);
         border-radius:8px;padding:12px 16px;margin-bottom:20px;color:#4ade80;font-size:0.84rem"
         th:text="${sucesso}"></div>

    <div class="table-card" style="padding:28px 32px">
        <form th:action="${onibus.id != null}
                          ? @{/onibus/editar/{id}(id=${onibus.id})}
                          : @{/onibus/novo}"
              method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

                <!-- Prefixo -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Prefixo / Placa</label>
                    <input type="text" name="prefixo"
                           th:value="${onibus.prefixo}"
                           placeholder="Ex: SP-7001"
                           required
                           style="background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;
                                  padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:0.85rem;
                                  width:100%"/>
                </div>

                <!-- Ano de Fabricação -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Ano de Fabricação</label>
                    <input type="number" name="anoFabricacao"
                           th:value="${onibus.anoFabricacao > 0} ? ${onibus.anoFabricacao} : 2020"
                           min="1990" max="2030"
                           required
                           style="background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;
                                  padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:0.85rem;
                                  width:100%"/>
                </div>

                <!-- Tipo -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Tipo de Veículo</label>
                    <select name="tipo" required class="select-sm" style="width:100%;padding:9px 12px">
                        <option value="">Selecione...</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t.name()}"
                                th:text="${t.descricao}"
                                th:selected="${onibus.tipo == t}">
                        </option>
                    </select>
                </div>

                <!-- Padrão Motor -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Padrão Motor</label>
                    <select name="padraoMotor" required class="select-sm" style="width:100%;padding:9px 12px">
                        <option value="">Selecione...</option>
                        <option th:each="p : ${padroes}"
                                th:value="${p.name()}"
                                th:text="${p.descricao}"
                                th:selected="${onibus.padraoMotor == p}">
                        </option>
                    </select>
                </div>

                <!-- Combustível -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Combustível</label>
                    <select name="combustivel" required class="select-sm" style="width:100%;padding:9px 12px">
                        <option value="">Selecione...</option>
                        <option th:each="c : ${combustiveis}"
                                th:value="${c.name()}"
                                th:text="${c.descricao}"
                                th:selected="${onibus.combustivel == c}">
                        </option>
                    </select>
                </div>

                <!-- Terminal -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">Terminal</label>
                    <select name="terminalId" required class="select-sm" style="width:100%;padding:9px 12px">
                        <option value="">Selecione...</option>
                        <option th:each="t : ${terminais}"
                                th:value="${t.id}"
                                th:text="${t.nome}"
                                th:selected="${onibus.terminal != null and onibus.terminal.id == t.id}">
                        </option>
                    </select>
                </div>

                <!-- KM Anuais -->
                <div style="display:flex;flex-direction:column;gap:6px">
                    <label style="font-size:0.72rem;font-family:var(--font-mono);text-transform:uppercase;
                                  letter-spacing:1px;color:var(--text-dim)">KM Anuais</label>
                    <input type="number" name="kmAnuais"
                           th:value="${onibus.kmAnuais}"
                           placeholder="Ex: 72000"
                           step="100" min="0"
                           style="background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;
                                  padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:0.85rem;
                                  width:100%"/>
                </div>

                <!-- Ar-condicionado -->
                <div style="display:flex;align-items:center;gap:12px;padding-top:24px">
                    <input type="checkbox" name="temArCondicionado" id="ac"
                           th:checked="${onibus.temArCondicionado}"
                           style="width:16px;height:16px;accent-color:var(--primary-light)"/>
                    <label for="ac" style="font-size:0.84rem;color:var(--text-muted);cursor:pointer">
                        Possui ar-condicionado
                    </label>
                </div>

            </div>

            <div style="display:flex;gap:12px;margin-top:28px">
                <button type="submit" class="btn-primary">
                    <span th:text="${onibus.id != null} ? 'Salvar Alterações' : 'Cadastrar Ônibus'">Salvar</span>
                </button>
                <a th:href="@{/onibus}" class="btn-outline">Cancelar</a>
            </div>
        </form>
    </div>

</th:block>
<th:block th:fragment="scriptsExtra"></th:block>
</body>
</html>
