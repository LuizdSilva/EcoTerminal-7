<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content, scriptsExtra)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EcoTerminal — Monitoramento de Emissões</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

    <style>
        /* ── Reset & Variáveis ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #0a0f0d;
            --bg-card:      #0f1612;
            --bg-card2:     #141c18;
            --bg-sidebar:   #0c1410;
            --border:       #1e3027;
            --border-light: #2a4035;
            --primary:      #16a34a;
            --primary-light:#22c55e;
            --accent-green: #4ade80;
            --danger:       #ef4444;
            --warn:         #f59e0b;
            --text:         #e8f5ee;
            --text-muted:   #7aab8f;
            --text-dim:     #3d6b52;
            --font:         'DM Sans', sans-serif;
            --font-mono:    'JetBrains Mono', monospace;
            --radius:       8px;
            --radius-lg:    12px;
            --sidebar-w:    240px;
            --topbar-h:     56px;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }

        /* ── Topbar ────────────────────────────────────────────────────── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topbar-h);
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            gap: 16px;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .topbar-brand svg {
            width: 22px; height: 22px;
            stroke: var(--primary-light);
        }

        .topbar-spacer { flex: 1; }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .topbar-user strong {
            color: var(--text);
            font-size: 0.84rem;
        }

        .topbar-logout {
            font-size: 0.75rem;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            background: transparent;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.15s;
        }
        .topbar-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* ── Layout principal ──────────────────────────────────────────── */
        .app-layout {
            display: flex;
            margin-top: var(--topbar-h);
            min-height: calc(100vh - var(--topbar-h));
        }

        /* ── Sidebar ───────────────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            top: var(--topbar-h);
            bottom: 0;
            left: 0;
            overflow-y: auto;
            padding: 20px 0;
            z-index: 90;
        }

        .sidebar-section {
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .sidebar-label {
            font-size: 0.6rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 0 10px;
            margin-bottom: 6px;
            display: block;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius);
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.15s;
            position: relative;
        }

        .nav-link:hover {
            background: var(--bg-card2);
            color: var(--text);
        }

        .nav-link.active {
            background: rgba(34, 197, 94, 0.08);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0; top: 6px; bottom: 6px;
            width: 3px;
            background: var(--primary-light);
            border-radius: 0 3px 3px 0;
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .nav-link.active .nav-icon,
        .nav-link:hover .nav-icon {
            opacity: 1;
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 12px 20px;
        }

        /* ── Conteúdo principal ────────────────────────────────────────── */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 28px 32px;
            min-width: 0;
        }

        /* ── Componentes reutilizáveis ─────────────────────────────────── */
        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-header h2 {
            font-size: 1.35rem;
            font-weight: 800;
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .page-header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.15s;
        }

        .kpi-card:hover  { border-color: var(--border-light); }
        .kpi-card.ok     { border-color: rgba(34,197,94,0.25); }
        .kpi-card.danger { border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.04); }

        .kpi-label {
            font-size: 0.68rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .kpi-value {
            font-size: 1.9rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--accent-green);
            line-height: 1.1;
        }

        .kpi-card.danger .kpi-value { color: var(--danger); }

        .kpi-unit {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .chart-header h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .chart-badge {
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--text-dim);
            background: var(--bg-card2);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .chart-body { padding: 16px 18px; }

        /* Tables */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .table-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .table-card-header h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .data-table thead tr {
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            padding: 10px 16px;
            text-align: left;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .data-table td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }

        .data-table tbody tr:last-child td { border-bottom: none; }

        .data-table tbody tr:hover td {
            background: var(--bg-card2);
            color: var(--text);
        }

        .font-mono { font-family: var(--font-mono); font-size: 0.8rem; }

        /* Badges */
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .badge-online      { background: rgba(34,197,94,0.12);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .badge-maintenance { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .badge-offline     { background: rgba(239,68,68,0.10);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

        .alert-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
        .badge-danger { background: rgba(239,68,68,0.12);  color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
        .badge-ok     { background: rgba(34,197,94,0.10);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }

        /* Buttons */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .btn-primary:hover { background: var(--primary-light); color: #0a0f0d; }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-outline:hover { border-color: var(--accent-green); color: var(--accent-green); }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 0.15s;
            font-family: var(--font);
            color: var(--text-muted);
        }
        .btn-icon:hover { border-color: var(--border-light); color: var(--text); }

        .table-actions { display: flex; gap: 6px; align-items: center; }

        .text-danger { color: var(--danger) !important; }
        .text-ok     { color: var(--accent-green) !important; }

        /* Select */
        .select-sm {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 6px 10px;
            font-family: var(--font);
        }

        /* Station detail */
        .station-detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .station-code {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 6px;
        }
        .station-detail-info h2 {
            font-size: 1.4rem;
            font-weight: 800;
            font-family: var(--font-mono);
        }
        .station-detail-info p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .status-lg { font-size: 0.85rem !important; padding: 6px 16px !important; }

        /* Mini KPIs */
        .mini-kpi-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .mini-kpi {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 130px;
        }
        .mini-kpi-label {
            font-size: 0.62rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
        .mini-kpi-val {
            font-size: 1.1rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--accent-green);
        }

        /* Full width */
        .full-width { width: 100%; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    </style>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ── Topbar ──────────────────────────────────────────────────────── -->
<header class="topbar">
    <div class="topbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        EcoTerminal
    </div>

    <div class="topbar-spacer"></div>

    <div class="topbar-user">
        <span>Olá, <strong sec:authentication="name">Usuário</strong></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="topbar-logout">Sair</button>
        </form>
    </div>
</header>

<!-- ── Layout ──────────────────────────────────────────────────────── -->
<div class="app-layout">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-section">
            <span class="sidebar-label">Menu</span>

            <a th:href="@{/dashboard}" class="nav-link"
               th:classappend="${currentUri == '/dashboard'} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
                Dashboard
            </a>

            <a th:href="@{/onibus}" class="nav-link"
               th:classappend="${currentUri.startsWith('/onibus')} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="13" rx="2"/>
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                    <circle cx="7" cy="17" r="1"/><circle cx="17" cy="17" r="1"/>
                </svg>
                Ônibus
            </a>

            <a th:href="@{/leituras}" class="nav-link"
               th:classappend="${currentUri.startsWith('/leituras')} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                Leituras
            </a>

            <a th:href="@{/alertas}" class="nav-link"
               th:classappend="${currentUri.startsWith('/alertas')} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                Alertas
            </a>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <span class="sidebar-label">Terminais</span>
            <a th:href="@{/terminais}" class="nav-link"
               th:classappend="${currentUri.startsWith('/terminais')} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                Todos os Terminais
            </a>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <span class="sidebar-label">Auditoria</span>
            <a th:href="@{/relatorios}" class="nav-link"
               th:classappend="${currentUri != null and currentUri.startsWith('/relatorios')} ? ' active'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                Relatórios
            </a>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="main-content">
        <th:block th:replace="${content}"/>
    </main>

</div>

<!-- Scripts extras da página -->
<th:block th:replace="${scriptsExtra}"/>

</body>
</html>
